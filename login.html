<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style/stylelogin.css">
</head>
<body>
    <header>
        <form >
            <div class="title">
              LOGIN USER
            </div>

            <label for="user">USER:</label>
            <input type="text" id="user" placeholder="Ingresa tu contraseña">
            <label for="pass">Password</label>
            <div class="password-wrapper">
              <input type="password" id="pass" placeholder="Ingresa tu contraseña">
              <button type="button" class="toggle-password" id="btn-eye">
                <svg class="eye-open" xmlns="http://w3.org" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                  <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
                <svg class="eye-closed" xmlns="http://w3.org" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="display: none;">
                  <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.82l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.74-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-4 .7l2.17 2.15C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 2.19 0 4.25-.61 6-1.65l.66.66 2.07 2.07 1.41-1.41L3.41 2.86 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.43-1.45.68-2.3.68-2.76 0-5-2.24-5-5 0-.85.25-1.63.68-2.3zm2.59-2.59L11.4 8.5c.2-.03.4-.05.6-.05 1.66 0 3 1.34 3 3 0 .2-.02.4-.05.6l1.29 1.29c.43-.67.68-1.45.68-2.3 0-2.76-2.24-5-5-5-.85 0-1.63.25-2.3.68z"/>
                </svg>
              </button>
            </div>
            <button type="submit" class="cyber-btn">
                INGRESAR
                <span class="btn-glow"></span>
            </button>
              <ul class="nav-links">
                <li><a href="">REGISTER USER</a></li>
              </ul>
              
        </form>
        
    </header>
    <div class="cyber-toggle-wrapper">
  <input class="cyber-toggle-checkbox" id="cyber-toggle" type="checkbox" />
  <label class="cyber-toggle" for="cyber-toggle">
    <div class="cyber-toggle-track">
      <div class="cyber-toggle-track-glow"></div>
      <div class="cyber-toggle-track-dots">
        <span class="cyber-toggle-track-dot"></span>
        <span class="cyber-toggle-track-dot"></span>
        <span class="cyber-toggle-track-dot"></span>
      </div>
    </div>
    <div class="cyber-toggle-thumb">
      <div class="cyber-toggle-thumb-shadow"></div>
      <div class="cyber-toggle-thumb-highlight"></div>
      <div class="cyber-toggle-thumb-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path
            d="M16.5 12c0-2.48-2.02-4.5-4.5-4.5s-4.5 2.02-4.5 4.5 2.02 4.5 4.5 4.5 4.5-2.02 4.5-4.5zm-4.5 7.5c-4.14 0-7.5-3.36-7.5-7.5s3.36-7.5 7.5-7.5 7.5 3.36 7.5 7.5-3.36 7.5-7.5 7.5zm0-16.5c-4.97 0-9 4.03-9 9h-3l3.89 3.89.07.14 4.04-4.03h-3c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42c1.63 1.63 3.87 2.64 6.36 2.64 4.97 0 9-4.03 9-9s-4.03-9-9-9z"
          ></path>
        </svg>
      </div>
    </div>
    <div class="cyber-toggle-particles">
      <span class="cyber-toggle-particle"></span>
      <span class="cyber-toggle-particle"></span>
      <span class="cyber-toggle-particle"></span>
      <span class="cyber-toggle-particle"></span>
    </div>
  </label>
  <div class="cyber-toggle-labels">
    <span class="cyber-toggle-label-off">OFF</span>
    <span class="cyber-toggle-label-on">ON</span>
  </div>
</div>
<script src="scrip/scriptlogin.js"></script>
</body>


</html>
